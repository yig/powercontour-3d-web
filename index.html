<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Contour Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; color: #e6e6e6;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #view { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; width: 270px; max-height: calc(100% - 20px);
    overflow-y: auto; background: rgba(30, 32, 38, 0.92); border: 1px solid #3a3d45; border-radius: 8px;
    padding: 10px 12px; box-sizing: border-box; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #9aa0ab; margin: 12px 0 4px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row label { flex: 0 0 105px; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; color: #b8bec9; }
  .check { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
  select, input[type=number] { flex: 1; background: #2a2d34; color: inherit; border: 1px solid #444852;
    border-radius: 4px; padding: 2px 4px; min-width: 0; }
  button { background: #3b6ea8; color: white; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #4a80bd; }
  #faceLegend { font-size: 12px; line-height: 1.6; }
  #stats { margin-top: 10px; color: #9aa0ab; font-size: 12px; white-space: pre-line; }
  .legend { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  button.help { flex: 0 0 auto; margin-left: auto; width: 16px; height: 16px; padding: 0; border-radius: 50%;
    background: #3a3d45; color: #cfd3da; font-size: 11px; line-height: 16px; text-align: center; }
  button.help:hover, button.help[aria-expanded=true] { background: #3b6ea8; color: white; }
  #helpPop { position: fixed; z-index: 10; display: none; width: 280px; max-width: calc(100vw - 32px); box-sizing: border-box;
    background: #2a2d34; border: 1px solid #50545e; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
    color: #e6e6e6; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
</style>
<script src="vendor/three.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="shapes.js"></script>
<script src="powerdiagram.js"></script>
<script src="recover.js"></script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Power contour of an SDF</h1>
  <div style="color:#9aa0ab;font-size:12px">
    <span class="legend" style="background:#e0685a"></span>d &gt; 0 &nbsp;
    <span class="legend" style="background:#5a8fe0"></span>d &lt; 0 &nbsp;
    <span class="legend" style="background:#f0c040"></span>contour
  </div>

  <h2>Input</h2>
  <div class="row"><label>Shape</label>
    <select id="shape">
      <option value="sphere">Sphere</option>
      <option value="box">Box</option>
      <option value="torus" selected>Torus</option>
      <option value="cylinder">Cylinder</option>
      <option value="twospheres">Two spheres (union)</option>
      <option value="obj">OBJ file…</option>
    </select></div>
  <div class="row" id="objRow" style="display:none"><label>Mesh</label><span id="objName" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e0b050">No mesh: Load… or drop a file</span>
    <button type="button" id="objLoad">Load…</button><input type="file" id="objFile" accept=".obj" style="display:none"></div>
  <div class="row"><label>Sampling</label>
    <select id="sampling">
      <option value="random">Uniform random</option>
      <option value="grid">Jittered grid</option>
      <option value="regular">Regular grid</option>
      <option value="band">Near surface (|d| &lt; 0.1)</option>
    </select></div>
  <div class="row"><label>Points</label><input type="range" id="npts" min="10" max="1500" step="10" value="300"><span class="val" id="npts-v"></span></div>
  <div class="row"><label>Seed</label><input type="number" id="seed" value="1"></div>
  <label class="check"><input type="checkbox" id="sampled" checked> Sampled points</label>
  <div class="row"><label>Sphere scale</label><input type="range" id="sScale" min="0.01" max="1" step="0.01" value="1"><span class="val" id="sScale-v"></span></div>
  <label class="check"><input type="checkbox" id="balls"> Tangent balls instead of sample spheres</label>
  <div class="row" id="ballRhoRow"><label>Ball size ρ</label><input type="range" id="ballRho" min="0.05" max="1" step="0.05" value="0.5"><span class="val" id="ballRho-v"></span></div>
  <div class="row" id="ballCapRow"><label>Ball cap, log₁₀</label><input type="range" id="ballCap" min="-1" max="3" step="0.5" value="2"><span class="val" id="ballCap-v"></span></div>
  <label class="check"><input type="checkbox" id="tangent"> Tangent points</label>
  <label class="check"><input type="checkbox" id="mirrored"> Mirrored pairs t ± δn</label>

  <h2>Input spheres</h2>
  <div class="row"><label>Opacity</label><input type="range" id="sphOp" min="0" max="1" step="0.01" value="0.15"><span class="val" id="sphOp-v"></span></div>
  <label class="check"><input type="checkbox" id="centers" checked> Show centers</label>

  <h2>Power contour</h2>
  <div class="row"><label>Opacity</label><input type="range" id="pcOp" min="0" max="1" step="0.01" value="0.85"><span class="val" id="pcOp-v"></span></div>
  <label class="check"><input type="checkbox" id="pcEdges" checked> Show edges</label>
  <div class="row"><label>Face color</label>
    <select id="pcColorBy">
      <option value="uniform">Uniform</option>
      <option value="type">By face type</option>
    </select></div>
  <div id="faceLegend"></div>

  <h2>Recovered surface</h2>
  <div class="row"><label>Method</label>
    <select id="recMethod">
      <option value="off">Off</option>
      <option value="regions">Contract contour regions</option>
      <option value="extend">Extend own faces</option>
      <option value="patches">Triangulate step patches</option>
      <option value="merge">Merge steps into faces</option>
      <option value="collapse">Collapse and flip</option>
      <option value="clip">Clip tangent planes</option>
    </select></div>
  <label class="check"><input type="checkbox" id="recPreset" checked> Recommended settings on method change</label>
  <div id="extendOpts">
    <div class="row"><label>Dependent planes, log₁₀</label><input type="range" id="eTau" min="-14" max="-0.5" step="0.5" value="-12"><span class="val" id="eTau-v"></span></div>
    <div class="row"><label>Trust radius × spacing</label><input type="range" id="eTrust" min="0.5" max="10" step="0.1" value="2"><span class="val" id="eTrust-v"></span></div>
    <label class="check" id="eMergeRow"><input type="checkbox" id="eMerge" checked> Merge flipped junctions</label>
    <label class="check" id="pChamferRow"><input type="checkbox" id="pChamfer" checked> Chamfer far vertices</label>
    <label class="check" id="pStitchRow"><input type="checkbox" id="pStitch" checked> Stitch two-loop patches</label>
  </div>
  <div id="mergeOpts">
    <label class="check"><input type="checkbox" id="mSnap"> Snap vertices toward their planes</label>
    <label class="check"><input type="checkbox" id="mGaps"> Exactly planar faces, with gap faces</label>
  </div>
  <div id="clipOpts">
    <div class="row"><label>Parallel (°)</label><input type="range" id="cParallel" min="0" max="45" step="1" value="10"><span class="val" id="cParallel-v"></span></div>
    <label class="check"><input type="checkbox" id="cUnion" checked> Concave neighbors: union, not intersection</label>
    <label class="check"><input type="checkbox" id="cMutual" checked> Convex only if mutually below</label>
    <label class="check"><input type="checkbox" id="cRing2All"> Clip all faces by two-ring</label>
    <label class="check"><input type="checkbox" id="cFeatures"> Detect curved creases (thresholds):</label>
    <div class="row"><label>Similar (°)</label><input type="range" id="cSimilar" min="1" max="60" step="1" value="20"><span class="val" id="cSimilar-v"></span></div>
    <div class="row"><label>Turn × κr</label><input type="range" id="cTurn" min="0" max="10" step="0.1" value="3"><span class="val" id="cTurn-v"></span></div>
    <div class="row"><label>Turn + (°)</label><input type="range" id="cMargin" min="0" max="90" step="1" value="10"><span class="val" id="cMargin-v"></span></div>
    <div class="row"><label>On plane × κr²</label><input type="range" id="cOnPlane" min="0" max="5" step="0.05" value="1"><span class="val" id="cOnPlane-v"></span></div>
    <label class="check"><input type="checkbox" id="cRing2" checked> Feature points: clip by two-ring</label>
    <label class="check"><input type="checkbox" id="cSplit" checked> Split points on one feature</label>
  </div>
  <div id="recLegend"></div>

  <h2>Reference</h2>
  <div class="row"><label>True surface</label><input type="range" id="surfOp" min="0" max="1" step="0.01" value="0"><span class="val" id="surfOp-v"></span></div>
  <label class="check"><input type="checkbox" id="slice"> Slice (keep z &lt; …)</label>
  <div class="row"><label>Slice z</label><input type="range" id="sliceZ" min="-1.5" max="1.5" step="0.01" value="0"><span class="val" id="sliceZ-v"></span></div>
  <label class="check"><input type="checkbox" id="bbox" checked> Show bounding box</label>

  <div id="stats"></div>
</div>
<div id="helpPop" role="tooltip"></div>

<script type="module">
const { OrbitControls } = THREE; // THREE is the global from vendor/three.js

const B = 1.5; // domain is [-B, B]^3
const $ = id => document.getElementById(id);

// ---------- SDFs ----------
// SDF and closest point from shapes.js; meshes for the true-surface overlay.
const shapes = {
  sphere: { ...Shapes.sphere, meshes: () => [new THREE.Mesh(new THREE.SphereGeometry(0.8, 64, 32))] },
  box: { ...Shapes.box, meshes: () => [new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.0, 0.8))] },
  torus: { ...Shapes.torus, meshes: () => [new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.3, 32, 96))] },
  cylinder: { ...Shapes.cylinder, meshes: () => [new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 96).rotateX(Math.PI / 2))] },
  twospheres: { ...Shapes.twospheres, meshes: () => [-0.45, 0.45].map(cx => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.55, 64, 32)); m.position.x = cx; return m;
  }) },
  obj: null, // set by loadOBJ
};

// ---------- OBJ meshes ----------
// The mesh is centered and scaled to fit [-1, 1]^3. Its SDF is exact for the triangles; the sign
// assumes a closed, consistently oriented mesh.
function loadOBJ(text, name) {
  let m;
  try { m = Shapes.fromOBJ(text, 1); } catch (e) { alert(`Could not load ${name}: ${e.message}`); return false; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(m.positions.flat(), 3));
  geo.setIndex(m.triangles.flat());
  geo.computeVertexNormals();
  shapes.obj = { sdf: m.sdf, closest: m.closest, meshes: () => [new THREE.Mesh(geo)] };
  $('objName').textContent = `${name} (${m.triangles.length} triangles)`;
  $('objName').title = name; $('objName').style.color = '#b8bec9';
  $('shape').value = 'obj';
  showObjRow(); compute();
  return true;
}
function showObjRow() { $('objRow').style.display = $('shape').value === 'obj' ? '' : 'none'; }
function readOBJFile(file) { if (file) file.text().then(t => loadOBJ(t, file.name)); }

// ---------- Sampling ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const BAND = 0.1; // "Near surface" sampling keeps points with |d| < BAND

function samplePoints(n, mode, seed, sdf) {
  const rnd = mulberry32(seed);
  const pts = [];
  if (mode === 'band') {
    while (pts.length < n) {
      const p = [(rnd() * 2 - 1) * B, (rnd() * 2 - 1) * B, (rnd() * 2 - 1) * B];
      if (Math.abs(sdf(p)) < BAND) pts.push(p);
    }
  } else if (mode === 'random') {
    for (let i = 0; i < n; i++) pts.push([(rnd() * 2 - 1) * B, (rnd() * 2 - 1) * B, (rnd() * 2 - 1) * B]);
  } else {
    const k = Math.max(2, Math.round(Math.cbrt(n)));
    const s = 2 * B / k;
    const jit = mode === 'grid' ? 0.8 : 0.0;
    for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) for (let l = 0; l < k; l++) {
      // Tiny jitter even for the regular grid avoids exactly degenerate (co-spherical) configurations.
      const e = () => (rnd() - 0.5) * (jit * s + 1e-6);
      pts.push([-B + (i + 0.5) * s + e(), -B + (j + 0.5) * s + e(), -B + (l + 0.5) * s + e()]);
    }
  }
  return pts;
}

// ---------- Three.js scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.localClippingEnabled = true;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
camera.position.set(3.2, -4.2, 3.0);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(3, -2, 5); camera.add(dl); scene.add(camera);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const clipPlanes = () => ($('slice').checked ? [clipPlane] : []);

const bboxHelper = new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(-B, -B, -B), new THREE.Vector3(B, B, B)), 0x555a66);
scene.add(bboxHelper);

const COL_POS = new THREE.Color(0xe0685a), COL_NEG = new THREE.Color(0x5a8fe0);
const COL_PC = new THREE.Color(0xf0c040);
// Contour faces by the kinds of the two sites they separate (the "By face type" coloring).
// Only an OWN face (a sample and its own tangent point) contains the tangent point.
const FACE_TYPES = [
  { key: 'ss', label: 'sample – sample', color: COL_PC },
  { key: 'own', label: 'sample – own tangent', color: new THREE.Color(0x60d0a0) },
  { key: 'other', label: 'sample – other tangent', color: new THREE.Color(0xb080e0) },
  { key: 'tt', label: 'tangent – tangent', color: new THREE.Color(0xe0e0e0) },
  { key: 'mplane', label: 'mirror pair (tangent plane)', color: new THREE.Color(0x60d0a0) },
  { key: 'mstep', label: 'mirror step (Voronoi face)', color: new THREE.Color(0xe07040) },
];

let groups = { merged: null, centers: null, edges: null, surface: null, recovered: null };
const REC_LAMBDA = 0.01; // recover.js: Tikhonov pull toward the contour vertex, used only if tau = 0
const MIRROR_DELTA = 1e-3; // mirrored pairs sit at t ± δn
const COL_REC = new THREE.Color(0x9fc6d8), COL_REC_FEATURE = new THREE.Color(0xf0a040);
let data = null; // { sites, weights, signs, isTangent, owner, cells }

function disposeGroup(obj) {
  if (!obj) return;
  scene.remove(obj);
  obj.traverse(o => { o.geometry?.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m?.dispose()); });
}

const extendOpts = () => ({ tau: 10 ** +$('eTau').value, trust: +$('eTrust').value >= 10 ? Infinity : +$('eTrust').value, maxJunction: $('eMerge').checked ? 4 : 3,
  chamfer: $('pChamfer').checked, stitch: $('pStitch').checked });
// The clip options only re-clip; the diagrams are not recomputed.
const clipOpts = () => ({ parallelDeg: +$('cParallel').value, features: $('cFeatures').checked, similarDeg: +$('cSimilar').value,
  turnFactor: +$('cTurn').value, marginDeg: +$('cMargin').value, onPlaneFactor: +$('cOnPlane').value,
  ring2: $('cRing2').checked, ring2All: $('cRing2All').checked, splitFeature: $('cSplit').checked,
  concaveUnion: $('cUnion').checked, mutualConvex: $('cMutual').checked });
const clipPlanesNow = () => ({ clip: true, ...Recover.clipTangentPlanes(data.planes, data.nbrs, clipOpts()) });

function compute() {
  const shape = shapes[$('shape').value];
  if (!shape) return; // "OBJ file…" before a mesh is loaded: keep the previous scene
  const inputs = samplePoints(+$('npts').value, $('sampling').value, +$('seed').value | 0, shape.sdf);
  const sites = [], weights = [], signs = [], isTangent = [], isMirror = [], owner = []; // owner: index of the sample a site comes from
  const planes = new Map(); // owner -> its tangent plane { point, normal, d }
  inputs.forEach((p, k) => {
    const d = shape.sdf(p);
    if (Math.abs(d) < 1e-9) return; // already on the surface: no tangent plane
    const t = shape.closest(p); // exact: the normal is the unit vector from t to p
    planes.set(k, { point: t, normal: [(p[0] - t[0]) / d, (p[1] - t[1]) / d, (p[2] - t[2]) / d], d });
  });
  // Tangent balls (Approach 4): one ball per tangent point, on the side with the larger empty ball.
  const tb = $('balls').checked ? Recover.tangentBallSites(planes, { rho: +$('ballRho').value, cap: 10 ** +$('ballCap').value }) : null;
  if ($('sampled').checked && tb) {
    for (let k = 0; k < planes.size; k++) {
      sites.push(tb.sites[k]); weights.push(tb.weights[k]); signs.push(tb.signs[k]); isTangent.push(false); isMirror.push(false); owner.push(tb.owner[k]);
    }
  } else if ($('sampled').checked) {
    // Sphere scale s moves each sample toward its tangent point, keeping its sphere tangent there:
    // the own face (sample | tangent point) stays exactly in the tangent plane for any s.
    const sc = +$('sScale').value;
    inputs.forEach((p, k) => {
      const d = shape.sdf(p), t = planes.get(k)?.point ?? p;
      sites.push([t[0] + sc * (p[0] - t[0]), t[1] + sc * (p[1] - t[1]), t[2] + sc * (p[2] - t[2])]);
      weights.push((sc * d) ** 2); signs.push(d >= 0 ? 1 : -1); isTangent.push(false); isMirror.push(false); owner.push(k);
    });
  }
  if ($('tangent').checked) {
    for (const [k, { point, d }] of planes) {
      sites.push(point); weights.push(0); signs.push(tb ? -tb.balls.get(k).side : d >= 0 ? -1 : 1); isTangent.push(true); isMirror.push(false); owner.push(k);
    }
  }
  if ($('mirrored').checked) {
    const m = Recover.mirroredSites(planes, MIRROR_DELTA);
    m.sites.forEach((p, k) => { sites.push(p); weights.push(0); signs.push(m.signs[k]); isTangent.push(true); isMirror.push(true); owner.push(m.owner[k]); });
  }
  const t0 = performance.now();
  // Big balls lose precision in |p|² − w: pass it computed from t and n (lifts).
  const lifts = tb ? sites.map((p, i) => i < (($('sampled').checked) ? planes.size : 0) ? tb.lifts[i] : p[0] * p[0] + p[1] * p[1] + p[2] * p[2] - weights[i]) : undefined;
  const cells = PowerDiagram.computePowerDiagram(sites, weights, [-B, -B, -B], [B, B, B], lifts);
  const ms = performance.now() - t0;
  data = { sites, weights, signs, isTangent, isMirror, owner, planes, cells, ms };
  data.recovered = null;
  const method = $('recMethod').value;
  const contractible = $('sampled').checked && $('tangent').checked && !$('mirrored').checked;
  if (method === 'extend' && contractible) {
    data.recovered = Recover.extendOwnFaces(sites, signs, owner, cells, planes, extendOpts());
  } else if ((method === 'patches' || method === 'collapse') && contractible) {
    data.recovered = Recover.triangulatePatches(sites, signs, owner, cells, planes, { ...extendOpts(), rank: method === 'collapse' });
  } else if (method === 'merge' && contractible) {
    data.recovered = Recover.mergeSteps(sites, signs, owner, cells, planes, { snap: $('mSnap').checked ? 0.1 : 0, gaps: $('mGaps').checked });
  } else if (method === 'regions' && contractible) {
    // Intersects the tangent planes of the regions that the sample-to-own-tangent faces grow into.
    data.recovered = Recover.recoverSurface(sites, signs, owner, cells, planes, REC_LAMBDA, extendOpts().tau, extendOpts().trust);
  } else if (method === 'clip') {
    // Connectivity from the mirrored-pair diagram (reused if that is exactly what is displayed).
    const onlyMirror = !$('sampled').checked && !$('tangent').checked && $('mirrored').checked;
    const m = onlyMirror ? { signs, owner } : Recover.mirroredSites(planes, MIRROR_DELTA);
    const mcells = onlyMirror ? cells : PowerDiagram.computePowerDiagram(m.sites, m.weights, [-B, -B, -B], [B, B, B]);
    data.nbrs = Recover.contourNeighbors(m.signs, m.owner, mcells);
    data.recovered = clipPlanesNow();
  }
  rebuildAll();
}

function rebuildAll() {
  buildCenters(); buildTransparent(); buildSurface(); buildRecovered(); updateStats();
}

function buildCenters() {
  disposeGroup(groups.centers);
  const { sites, signs, isTangent } = data;
  const n = sites.length;
  const cinst = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), new THREE.MeshBasicMaterial({ clippingPlanes: clipPlanes() }), n);
  const m = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const cr = isTangent[i] ? 0.012 : 0.018;
    m.makeScale(cr, cr, cr).setPosition(...sites[i]); cinst.setMatrixAt(i, m);
    const c = signs[i] > 0 ? COL_POS : COL_NEG;
    cinst.setColorAt(i, isTangent[i] ? c.clone().lerp(new THREE.Color(1, 1, 1), 0.5) : c);
  }
  groups.centers = cinst;
  scene.add(cinst);
  applyVisuals();
}

// The input spheres and the contour faces live in ONE mesh so that they can be interleaved in a
// single back-to-front order (see sortTransparent). Each object (one sphere, or one contour face)
// owns a contiguous range of unshared vertices; sorting only permutes these ranges in the index buffer.
const SPHERE_TEMPLATE = new THREE.SphereGeometry(1, 20, 12).toNonIndexed();

function buildTransparent() {
  disposeGroup(groups.merged); disposeGroup(groups.edges);
  const { sites, weights, signs, isTangent, owner, cells } = data;
  const byType = $('pcColorBy').value === 'type';
  const { isMirror } = data;
  const faceType = (i, j) => isMirror[i] || isMirror[j] ? (isMirror[i] && isMirror[j] && owner[i] === owner[j] ? 4 : 5)
    : isTangent[i] && isTangent[j] ? 3 : !isTangent[i] && !isTangent[j] ? 0 : owner[i] === owner[j] ? 1 : 2;
  const typeCount = FACE_TYPES.map(() => 0);
  const tp = SPHERE_TEMPLATE.attributes.position.array, tn = SPHERE_TEMPLATE.attributes.normal.array;
  const tv = tp.length / 3;

  const sphereSites = [];
  // Tangent balls can be far bigger than the domain; those are not drawn.
  for (let k = 0; k < sites.length; k++) if (weights[k] > 0 && weights[k] <= 4 * B * B) sphereSites.push(k);
  const faces = []; // { i: positive site, j: negative site, verts }
  let area = 0;
  cells.forEach((cf, i) => {
    if (signs[i] <= 0) return; // emit each separating face once, from its positive side
    for (const f of cf) if (f.label >= 0 && signs[f.label] < 0) { faces.push({ i, j: f.label, verts: f.verts }); area += PowerDiagram.polygonArea(f.verts); }
  });

  const nSph = sphereSites.length, nObj = nSph + faces.length;
  const nSphV = nSph * tv;
  let nV = nSphV;
  for (const f of faces) nV += 3 * (f.verts.length - 2);
  const pos = new Float32Array(3 * nV), nor = new Float32Array(3 * nV), col = new Float32Array(4 * nV), cull = new Float32Array(nV);
  const start = new Uint32Array(nObj), count = new Uint32Array(nObj);
  const siteA = new Int32Array(nObj), siteB = new Int32Array(nObj); // sphere: (k, -1); face: (i, j)
  let v = 0;
  const put = (p, n, c, cb) => {
    pos.set(p, 3 * v); nor.set(n, 3 * v); col[4 * v] = c.r; col[4 * v + 1] = c.g; col[4 * v + 2] = c.b; cull[v] = cb; v++;
  };
  sphereSites.forEach((k, o) => {
    start[o] = v; count[o] = tv; siteA[o] = k; siteB[o] = -1;
    const r = Math.sqrt(weights[k]), p = sites[k], c = signs[k] > 0 ? COL_POS : COL_NEG;
    for (let t = 0; t < tv; t++) {
      put([p[0] + r * tp[3 * t], p[1] + r * tp[3 * t + 1], p[2] + r * tp[3 * t + 2]], [tn[3 * t], tn[3 * t + 1], tn[3 * t + 2]], c, 1);
    }
  });
  const epos = [];
  faces.forEach((f, fi) => {
    const o = nSph + fi, vs = f.verts;
    start[o] = v; siteA[o] = f.i; siteB[o] = f.j;
    const type = faceType(f.i, f.j);
    typeCount[type]++;
    const c = byType ? FACE_TYPES[type].color : COL_PC;
    // Newell normal (DoubleSide lighting flips it for back faces).
    const n = [0, 0, 0];
    for (let k = 0; k < vs.length; k++) {
      const a = vs[k], b = vs[(k + 1) % vs.length];
      n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]);
    }
    const nl = Math.hypot(n[0], n[1], n[2]) || 1; n[0] /= nl; n[1] /= nl; n[2] /= nl;
    for (let k = 1; k + 1 < vs.length; k++) { put(vs[0], n, c, 0); put(vs[k], n, c, 0); put(vs[k + 1], n, c, 0); }
    count[o] = v - start[o];
    for (let k = 0; k < vs.length; k++) epos.push(...vs[k], ...vs[(k + 1) % vs.length]);
  });

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 4)); // RGBA: alpha carries per-object opacity
  g.setAttribute('cullBack', new THREE.BufferAttribute(cull, 1));
  const iota = Uint32Array.from({ length: nV }, (_, k) => k);
  const index = new THREE.BufferAttribute(new Uint32Array(nV), 1);
  index.setUsage(THREE.DynamicDrawUsage);
  g.setIndex(index);
  g.setDrawRange(0, 0);
  // depthWrite is off: correctness comes from the draw order, not the depth buffer.
  // forceSinglePass: otherwise three.js draws transparent DoubleSide meshes as all back faces,
  // then all front faces, which breaks the order.
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: true, depthWrite: false,
    forceSinglePass: true, roughness: 0.5, metalness: 0.05, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    clippingPlanes: clipPlanes() });
  // Spheres show only their front faces (the contour shows both sides), so the back half of a
  // sphere never blends over its own front half.
  mat.onBeforeCompile = s => {
    s.vertexShader = 'attribute float cullBack;\nvarying float vCullBack;\n' +
      s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vCullBack = cullBack;');
    s.fragmentShader = 'varying float vCullBack;\n' +
      s.fragmentShader.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (vCullBack > 0.5 && !gl_FrontFacing) discard;');
  };
  groups.merged = new THREE.Mesh(g, mat);
  groups.merged.renderOrder = 1;
  groups.merged.userData = { nSph, nSphV, start, count, siteA, siteB, iota, keys: new Float64Array(nObj),
    order: new Uint32Array(nObj), lastEye: null, alphas: null };

  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.Float32BufferAttribute(epos, 3));
  // Opaque edges are drawn in the opaque pass and write depth, so the transparent mesh
  // correctly covers edges behind it and is hidden behind edges in front of it.
  groups.edges = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x222222, clippingPlanes: clipPlanes() }));
  scene.add(groups.merged, groups.edges);
  data.nFaces = faces.length; data.area = area;
  $('faceLegend').innerHTML = byType ? FACE_TYPES.map((t, k) =>
    `<span class="legend" style="background:#${t.color.getHexString()}"></span>${t.label}: ${typeCount[k]}`).join('<br>') : '';
  applyVisuals();
}

// Draw spheres and contour faces back to front. Sort key: the eye's power distance to the sites,
// pi_k = |e - p_k|^2 - w_k. Along any ray from the eye, power cells are crossed in increasing pi
// (lower envelope of lines in the ray parameter), so decreasing pi is back to front for cells.
//   sphere k            -> pi_k
//   face between i, j   -> max(pi_i, pi_j): right after the farther cell (ties: sphere first)
// This is exact among contour faces and for sphere parts inside their own cell. Sphere parts
// outside their cell lie inside other spheres of the same color, where errors are hard to see.
// The keys depend only on the eye position, so rotating in place needs no re-sort.
function sortTransparent() {
  const mesh = groups.merged;
  if (!mesh || !mesh.visible) return;
  const u = mesh.userData, e = camera.position;
  if (u.lastEye && u.lastEye.equals(e)) return;
  u.lastEye = e.clone();
  const { sites, weights } = data;
  const pi = new Float64Array(sites.length);
  for (let k = 0; k < sites.length; k++) {
    const p = sites[k];
    pi[k] = (p[0] - e.x) ** 2 + (p[1] - e.y) ** 2 + (p[2] - e.z) ** 2 - weights[k];
  }
  const { nSph, start, count, siteA, siteB, keys, order, iota } = u;
  const showSph = +$('sphOp').value > 0, showPc = +$('pcOp').value > 0;
  let n = 0;
  for (let o = 0; o < keys.length; o++) {
    const isSph = o < nSph;
    if (isSph ? !showSph : !showPc) continue;
    keys[o] = isSph ? pi[siteA[o]] : Math.max(pi[siteA[o]], pi[siteB[o]]);
    order[n++] = o;
  }
  const ord = order.subarray(0, n);
  ord.sort((a, b) => (keys[b] - keys[a]) || ((a < nSph ? 0 : 1) - (b < nSph ? 0 : 1)));
  const idx = mesh.geometry.index;
  let w = 0;
  for (let k = 0; k < n; k++) { const o = ord[k]; idx.array.set(iota.subarray(start[o], start[o] + count[o]), w); w += count[o]; }
  mesh.geometry.setDrawRange(0, w);
  idx.clearUpdateRanges(); idx.addUpdateRange(0, w);
  idx.needsUpdate = true;
}

// Fully opaque objects go in the opaque pass and write depth; others are blended without depth writes.
function setOpacity(material, opacity) {
  const transparent = opacity < 0.99;
  if (material.transparent !== transparent) { material.transparent = transparent; material.needsUpdate = true; }
  material.depthWrite = !transparent;
  material.opacity = opacity;
}

function buildSurface() {
  disposeGroup(groups.surface);
  const grp = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xcccccc, transparent: true, depthWrite: false, roughness: 0.4, clippingPlanes: clipPlanes() });
  for (const m of shapes[$('shape').value]?.meshes() ?? []) { m.material = mat; grp.add(m); }
  grp.renderOrder = 2;
  groups.surface = grp; scene.add(grp);
  applyVisuals();
}

// Opaque, so it needs no sorting against the transparent mesh: it is drawn first and writes depth.
// Triangulate a face given as vertex ids (outer loop and hole loops) in the plane with normal n.
// Returns triangles as triples of vertex ids.
function triangulateFace(outer, holes, n) {
  const N = new THREE.Vector3(...n), U = new THREE.Vector3(Math.abs(n[0]) < 0.9 ? 1 : 0, Math.abs(n[0]) < 0.9 ? 0 : 1, 0).cross(N).normalize(), W = N.clone().cross(U);
  const to2 = k => { const p = new THREE.Vector3(...data.recovered.verts[k]), v = new THREE.Vector2(p.dot(U), p.dot(W)); v.id = k; return v; };
  const C = outer.map(to2), H = holes.map(h => h.map(to2));
  const tris = THREE.ShapeUtils.triangulateShape(C, H), all = [...C, ...H.flat()]; // indexes the (possibly reordered) inputs
  return tris.map(t => t.map(i => all[i].id));
}

function buildRecovered() {
  disposeGroup(groups.recovered);
  groups.recovered = null;
  const r = data.recovered;
  $('recLegend').innerHTML = (r?.clip ? [[COL_REC, 'tangent plane face'], [COL_REC_FEATURE, 'corner / edge / crease tangent point']]
    : r?.patchStats?.chamfers ? [[COL_REC, 'tangent plane face'], [COL_REC_FEATURE, 'chamfer (planes meet beyond the trust radius)']]
    : r?.mergeStats?.gapFaces ? [[COL_REC, 'tangent plane face'], [COL_REC_FEATURE, 'gap face (between neighboring planes)']] : [])
    .map(([c, l]) => `<span class="legend" style="background:#${c.getHexString()}"></span>${l}`).join('<br>');
  if (!r) { applyVisuals(); return; }
  const pos = [], col = [], epos = [], hole = [];
  if (r.clip) {
    // Each face is its own polygon; nothing is shared, so there are no hole edges to report.
    for (const P of r.polys) {
      const V = P.pts, c = P.feature ? COL_REC_FEATURE : COL_REC;
      for (let k = 1; k + 1 < V.length; k++) { pos.push(...V[0], ...V[k], ...V[k + 1]); for (let q = 0; q < 3; q++) col.push(c.r, c.g, c.b); }
      for (let k = 0; k < V.length; k++) epos.push(...V[k], ...V[(k + 1) % V.length]);
    }
  } else for (const P of r.polys) {
    // Faces may be non-convex, pinched (a vertex visited twice) or have holes: ear-clip in their plane.
    for (const t of triangulateFace(P.verts, P.holes || [], P.normal)) {
      const c = P.chamfer || P.gap ? COL_REC_FEATURE : COL_REC;
      for (const k of t) { pos.push(...r.verts[k]); col.push(c.r, c.g, c.b); }
    }
    for (const L of [P.verts, ...(P.holes || [])]) for (let k = 0; k < L.length; k++) epos.push(...r.verts[L[k]], ...r.verts[L[(k + 1) % L.length]]);
  }
  // Holes: a directed polygon edge whose reverse is in no polygon borders a missing region.
  const loops = r.clip ? [] : r.polys.flatMap(P => [P.verts, ...(P.holes || [])]), dir = new Set();
  for (const L of loops) L.forEach((a, k) => dir.add(`${a},${L[(k + 1) % L.length]}`));
  for (const L of loops) L.forEach((a, k) => {
    const b = L[(k + 1) % L.length];
    if (!dir.has(`${b},${a}`)) hole.push(...r.verts[a], ...r.verts[b]);
  });
  r.nHoleEdges = hole.length / 6;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: true,
    roughness: 0.45, metalness: 0.05, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: clipPlanes() })));
  const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.Float32BufferAttribute(epos, 3));
  grp.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x2a3440, clippingPlanes: clipPlanes() })));
  const hg = new THREE.BufferGeometry(); hg.setAttribute('position', new THREE.Float32BufferAttribute(hole, 3));
  grp.add(new THREE.LineSegments(hg, new THREE.LineBasicMaterial({ color: 0xff3030, clippingPlanes: clipPlanes() })));
  groups.recovered = grp; scene.add(grp);
  applyVisuals();
}

function applyVisuals() {
  const sphOp = +$('sphOp').value, pcOp = +$('pcOp').value, surfOp = +$('surfOp').value;
  if (groups.merged) {
    const mesh = groups.merged, u = mesh.userData;
    if (!u.alphas || u.alphas[0] !== sphOp || u.alphas[1] !== pcOp) {
      const ca = mesh.geometry.attributes.color, a = ca.array, nV = a.length / 4;
      for (let k = 0; k < nV; k++) a[4 * k + 3] = k < u.nSphV ? sphOp : pcOp;
      ca.needsUpdate = true;
      u.alphas = [sphOp, pcOp];
      u.lastEye = null; // the set of drawn objects may have changed: re-sort
    }
    // When everything drawn is opaque, use the opaque pass so depth is written (matters for the true-surface overlay).
    const opaque = (sphOp === 0 || sphOp >= 0.99) && (pcOp === 0 || pcOp >= 0.99);
    if (mesh.material.transparent === opaque) { mesh.material.transparent = !opaque; mesh.material.needsUpdate = true; }
    mesh.material.depthWrite = opaque;
    mesh.visible = sphOp > 0 || pcOp > 0;
  }
  if (groups.centers) groups.centers.visible = $('centers').checked;
  if (groups.edges) { groups.edges.visible = $('pcEdges').checked; groups.edges.material.color.set(pcOp > 0 ? 0x222222 : COL_PC); }
  if (groups.surface) {
    groups.surface.visible = surfOp > 0;
    groups.surface.children.forEach(m => setOpacity(m.material, surfOp));
  }
  bboxHelper.visible = $('bbox').checked;
  clipPlane.constant = +$('sliceZ').value;
  const planes = clipPlanes();
  scene.traverse(o => { if (o.material && o !== bboxHelper) o.material.clippingPlanes = planes; });
  $('clipOpts').style.display = $('recMethod').value === 'clip' ? '' : 'none';
  $('mergeOpts').style.display = $('recMethod').value === 'merge' ? '' : 'none';
  for (const id of ['ballRhoRow', 'ballCapRow']) $(id).style.display = $('balls').checked ? '' : 'none';
  $('extendOpts').style.display = ['extend', 'regions', 'patches', 'collapse'].includes($('recMethod').value) ? '' : 'none';
  $('eMergeRow').style.display = $('recMethod').value === 'extend' ? '' : 'none';
  for (const id of ['pChamferRow', 'pStitchRow']) $(id).style.display = ['patches', 'collapse'].includes($('recMethod').value) ? '' : 'none';
  for (const id of ['npts', 'sScale', 'ballRho', 'ballCap', 'eTau', 'eTrust', 'sphOp', 'pcOp', 'surfOp', 'sliceZ', 'cParallel', 'cSimilar', 'cTurn', 'cMargin', 'cOnPlane']) $(id + '-v').textContent = (+$(id).value).toString().slice(0, 5);
}

function updateStats() {
  const nm = data.isMirror.filter(Boolean).length, nt = data.isTangent.filter(Boolean).length - nm, ns = data.sites.length - nt - nm;
  const empty = data.cells.filter(c => c.length === 0).length;
  $('stats').textContent =
    `${ns} sampled + ${nt} tangent + ${nm} mirrored sites\n` +
    `${empty} empty power cells\n` +
    `${data.nFaces} contour faces, area ${data.area.toFixed(3)}\n` +
    ($('recMethod').value === 'off' ? '' : !data.recovered ? 'needs sampled + tangent points only\n'
      : data.recovered.nTriples !== undefined ? `extended faces: ${data.recovered.polys.length} faces, ${data.recovered.verts.length} vertices ` +
        `(${data.recovered.nMerged} merged junctions), ${data.recovered.nDegenerate} degenerate, ${data.recovered.nHoleEdges} hole edges\n`
      : data.recovered.patchStats ? patchLine(data.recovered)
      : data.recovered.mergeStats ? mergeLine(data.recovered)
      : data.recovered.clip ? `clipped planes: ${data.recovered.polys.length} faces, ${data.recovered.nEmpty} clipped away ` +
        `(${data.recovered.nEmptyFeature} at corners / creases)\n`
      : `recovered: ${data.recovered.polys.length} faces, ${data.recovered.verts.length} vertices, ` +
        `${data.recovered.nHoleEdges} hole edges\n` + recTopo(data.recovered.topo)) +
    `power diagram: ${data.ms.toFixed(0)} ms`;
}

function patchLine(r) {
  const t = r.patchStats;
  return `patches: ${r.polys.length} faces, ${r.verts.length} vertices, ${r.nHoleEdges} hole edges\n` +
    `${t.patches} step patches (${t.stitched} stitched, ${t.partitioned} by restricted Delaunay, ${t.flips} flips), ${t.chamfers} chamfers, ${t.junctions} junctions; loops ${t.convex} convex, ${t.concave} concave, ` +
    `${t.saddle} saddle, ${t.flat} flat` + (t.nonManifoldEdges ? `; ${t.nonManifoldEdges} non-manifold edges` : '') + (t.facelessOwners ? `; ${t.facelessOwners} tangent points without a face` : '') + '\n' +
    (t.collapsed === undefined ? '' : `collapse and flip: ${t.collapsed} coplanar collapses, ${t.envelopeFlips} envelope flips, ${t.mixedFlips} mixed flips; ` +
      `dependent triangles (exactly / nearly) ${t.dependentBefore.join(' / ')} → ${t.dependentAfter.join(' / ')}\n`);
}

function mergeLine(r) {
  const t = r.mergeStats;
  return `merged: ${r.polys.length - t.gapFaces} faces, ${r.verts.length} vertices, ${r.nHoleEdges} hole edges\n` +
    `${t.ownFaces} own faces + ${t.steps} steps; steps up to ${t.offPlane.toExponential(1)} off their face's plane` +
    (t.gapFaces ? `; ${t.gapFaces} gap faces up to ${t.gapWidth.toExponential(1)} wide` : '') + '\n' + recTopo(r.topo);
}

function recTopo(t) {
  if (!t) return '';
  const parts = [[t.splitRegions, 'split regions'], [t.annuli, 'faces with holes'], [t.pinched, 'pinched faces'], [t.erasedHoles, 'step-only holes erased'],
    [t.collapsed, 'regions with < 3 corners collapsed'], [t.multiArc, 'face pairs sharing 2+ edges']].filter(([n]) => n);
  return parts.length ? `topology: ${parts.map(([n, l]) => `${n} ${l}`).join(', ')}\n` : '';
}

// ---------- Help pop-ups ----------
// One text per control; a "?" button after each control shows it. README.md has the same texts.
const HELP = {
  shape: 'The surface: a sphere, a box, a torus, a capped cylinder (developable side, flat caps), the union of two spheres (which has a concave crease where they meet), or a triangle mesh from an OBJ file. Each has an exact SDF and closest point (shapes.js). An OBJ is centered and scaled to fit [−1, 1]³; you can also drop one onto the page. Its sign assumes a closed, consistently oriented mesh.',
  sampling: 'How sample points are placed in the box [−1.5, 1.5]³: uniform random, a jittered or regular grid, or uniform random keeping only points with |d| < 0.1.',
  npts: 'Number of sample points. The power diagram costs O(n²): 1500 points take a couple of seconds.',
  seed: 'Random seed for the sampling.',
  sampled: 'Put each sample into the power diagram: a site with weight d², i.e. a sphere of radius |d| that touches the surface at its closest point, signed by d.',
  sScale: 'Moves each sample toward its tangent point, p → t + s(p − t), and shrinks its sphere to radius s|d| so it stays tangent there. The face between a sample and its own tangent point stays exactly in the tangent plane for every s; only the other faces change, getting thinner as s → 0. About 0.1 is good for surface recovery.',
  balls: 'Replace each sample’s sphere by a ball tangent to the surface at the tangent point, on the side where the largest ball empty of other tangent points is bigger (the convex side; the sample’s sign is not used), with radius ρ × that empty radius, at most the cap. The face between a ball and its own tangent point stays exactly in the tangent plane. The other faces (steps) lie within (|x − t_a|² − |x − t_b|²) / 2λ of a tangent plane, so big balls flatten them onto the planes on convex, concave and developable parts; on saddles the empty balls are small and steps stay. Balls bigger than the domain are not drawn.',
  ballRho: 'Tangent balls: the ball radius as a fraction of the largest empty ball on its side. Below 1 so that the ball never touches another tangent point; 0.5 is the default.',
  ballCap: 'Tangent balls: the largest ball radius, 10^value. Where the surface is flat or convex the empty ball is unbounded; steps there shrink like 1/cap. 2 (radius 100) is the default; much larger loses precision.',
  tangent: 'Add each sample’s closest surface point as a site with weight 0 and the opposite sign. The face between a sample and its own tangent point lies exactly in the tangent plane.',
  mirrored: 'For each tangent point t with normal n, add the pair t + δn (outside) and t − δn (inside), δ = 0.001. Their contour is each tangent plane clipped to t’s Voronoi cell, plus thin steps between neighbors.',
  sphOp: 'Opacity of the sample spheres (radius √weight). 0 hides them.',
  centers: 'Dots at the site positions. Tangent points are smaller and lighter.',
  pcOp: 'Opacity of the power contour: the faces between a + cell and a − cell. 0 hides it.',
  pcEdges: 'Outline the contour faces.',
  pcColorBy: 'Uniform gold, or color each face by the kinds of sites it separates, with a legend and counts. Green faces (a sample and its own tangent point) lie exactly in the tangent plane; the others are steps between them.',
  recPreset: 'When the method changes, set the controls it uses to their recommended values: sampled + tangent points, sphere scale 0.1, exact dependent planes (−12) and trust radius 2 for the plane-intersection methods (with Merge flipped junctions, Chamfer and Stitch on); tangent balls with ρ 0.5 and cap 10² for Merge steps into faces; the default clip options for Clip tangent planes. Uncheck to keep your own settings when switching. See RECOVERY.md, Parameters.',
  recMethod: 'Build a surface whose faces lie in the tangent planes. Contract contour regions: give each other contour face to one of its two own faces, and intersect the tangent planes where regions meet. Extend own faces: extend each own face from its own boundary, without assigning the other faces. Triangulate step patches: remove each patch of other faces by triangulating the loop of own faces around it, choosing the triangulation from the tangent planes (their envelope where the loop is convex or concave; a decider on saddles). Merge steps into faces: give each other contour face to the owner whose tangent plane it is nearer, and keep every vertex of the resulting regions at its contour position (a vertex of the power diagram, never a plane intersection). Meant for Tangent balls, where the steps nearly lie in the planes; faces are then planar up to the step heights. Collapse and flip: Triangulate step patches, then merge faces whose planes coincide, flip toward the planes’ envelope where four faces are all convex or all concave (a test with the 4 × 4 determinant of the planes, valid even when three planes meet at infinity), and in quads with convex and concave edges flip where it pulls vertices into the trust radius and un-inverts edges. These five need sampled + tangent points only. Clip tangent planes: clip each tangent plane by its neighbors’ planes (any sites). See RECOVERY.md.',
  mSnap: 'Merge steps into faces: move each vertex to the point that minimizes the squared distances to its faces’ tangent planes plus 0.1 × its squared distance to its contour position. Faces get flatter; vertices move by about the step height.',
  mGaps: 'Merge steps into faces: give every face its own copies of its corners, projected onto its tangent plane, so it is exactly planar; then close the gaps between neighbors with orange gap faces (one per shared edge, one per vertex shared by three or more faces). Watertight; the gaps are as wide as the steps.',
  eTau: 'Planes count as dependent (e.g. coplanar faces of the box) when eigenvalues of Σ n nᵀ fall below 10^value × the largest; the vertex then keeps its contour position in those directions. With the trust radius on, this only needs to catch exact degeneracies: −12 is numerical precision. Without it (trust at 10 = off), about −2 is needed to stop nearly dependent planes from sending vertices far away.',
  eTrust: 'A tangent plane is only accurate within about one sample spacing of its tangent point. A vertex may move at most this many spacings (the distance from its contour position to the farthest of its tangent points) away from its contour position: it is the exact intersection of its planes if that is near, else the nearest point on the line where the two best-determined planes meet, else on one plane. 2 keeps box corners exact and removes far-away vertices on curved shapes. 10 = off.',
  pChamfer: 'Triangulate step patches and Collapse and flip: where three tangent planes meet beyond the trust radius, replace that vertex by a small orange chamfer face with one point on each line where two of the planes meet. Every tangent-plane face then stays exactly planar. Off: the vertex is pulled back within the trust radius instead, off some of its planes.',
  pStitch: 'Triangulate step patches and Collapse and flip: a patch of steps with two boundary loops (a ring, or an own face as an island inside it) is triangulated by stitching the two loops with the planes’ envelope cost. Off: such patches keep the nearest-tangent-point partition.',
  eMerge: 'Extend own faces: where four owners meet at nearly one point and their faces disagree about which diagonal is an edge, merge the junction into one vertex where all four planes meet. Off: such junctions leave cracks.',
  cParallel: 'Clip tangent planes: neighbors whose normals differ by less than this angle are split by their Voronoi bisector instead of by the line where their planes meet.',
  cUnion: 'Clip tangent planes: across a concave crease a face must be above at least one plane from the other side, not all of them, so concave constraints are combined by union (overlapping pieces).',
  cMutual: 'Clip tangent planes: a neighbor pair counts as convex only if each tangent point is below the other’s plane; mixed pairs only join the union.',
  cRing2All: 'Clip tangent planes: clip every face by its neighbors’ neighbors too. Removes outliers but over-clips smooth surfaces.',
  cFeatures: 'Clip tangent planes: detect points on curved creases with the thresholds below. Off by default: corners and edges between flat faces need no detection.',
  cSimilar: 'Crease detection: neighbors with normals within this angle count toward a patch’s curvature κ.',
  cTurn: 'Crease detection: a pair is a feature pair if its normals turn by more than this × κr plus the margin below (r: distance between the tangent points).',
  cMargin: 'Crease detection: extra angle added to the turn threshold above.',
  cOnPlane: 'Crease detection: a tangent point is on the feature if it is within this × κr² of the neighbor’s plane.',
  cRing2: 'Clip tangent planes: clip detected feature points by their neighbors’ neighbors too.',
  cSplit: 'Clip tangent planes: split two points on the same feature (or exactly on each other’s planes) by their Voronoi bisector, since their planes never separate them along the feature.',
  surfOp: 'Opacity of the exact surface, for comparison. 0 hides it.',
  slice: 'Hide everything above the horizontal plane at Slice z, to look inside.',
  sliceZ: 'Height of the slice plane.',
  bbox: 'Outline of the domain [−1.5, 1.5]³.',
};
const helpPop = $('helpPop');
let helpOpen = null;
function closeHelp() { helpPop.style.display = 'none'; helpOpen?.setAttribute('aria-expanded', 'false'); helpOpen = null; }
for (const [id, text] of Object.entries(HELP)) {
  const el = $(id), host = el.closest('.row') || el.closest('label.check');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'help'; b.textContent = '?'; b.setAttribute('aria-label', 'Help'); b.setAttribute('aria-expanded', 'false');
  b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation(); // inside a label: do not toggle its checkbox
    if (helpOpen === b) { closeHelp(); return; }
    closeHelp();
    helpPop.textContent = text; helpPop.style.display = 'block';
    const r = b.getBoundingClientRect(), panel = $('panel').getBoundingClientRect();
    const w = helpPop.offsetWidth, h = helpPop.offsetHeight;
    let left = panel.right + 8, top = r.top - 6;
    if (left + w > window.innerWidth - 8) left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)), top = r.bottom + 6;
    helpPop.style.left = `${left}px`; helpPop.style.top = `${Math.max(8, Math.min(top, window.innerHeight - h - 8))}px`;
    helpOpen = b; b.setAttribute('aria-expanded', 'true');
  });
  host.appendChild(b);
}
document.addEventListener('click', e => { if (helpOpen && !helpPop.contains(e.target)) closeHelp(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });

// ---------- UI wiring ----------
// Choosing "OBJ file…" shows the Load row. Some browsers (Safari) refuse a file picker opened from a
// menu change, so the Load button and dropping a file are the reliable paths.
$('shape').addEventListener('change', () => {
  showObjRow();
  if ($('shape').value === 'obj' && !shapes.obj) { try { $('objFile').click(); } catch {} return; }
  compute();
});
$('objLoad').addEventListener('click', () => $('objFile').click());
$('objFile').addEventListener('change', e => { readOBJFile(e.target.files[0]); e.target.value = ''; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); readOBJFile(e.dataTransfer.files[0]); });
for (const id of ['sampling', 'seed', 'sampled', 'tangent', 'mirrored', 'sScale', 'balls', 'ballRho', 'ballCap', 'mSnap', 'mGaps']) $(id).addEventListener('change', compute);
for (const id of ['ballRho', 'ballCap']) $(id).addEventListener('input', applyVisuals);
$('sScale').addEventListener('input', applyVisuals);
for (const id of ['eTau', 'eTrust', 'eMerge', 'pChamfer', 'pStitch']) $(id).addEventListener('change', compute);
for (const id of ['eTau', 'eTrust']) $(id).addEventListener('input', applyVisuals);
// Recommended settings per method (RECOVERY.md, Parameters), applied when the method changes if
// "Recommended settings on method change" is checked. Only the inputs a method uses are set.
const PLANE_PRESET = { sampled: true, tangent: true, mirrored: false, balls: false, sScale: 0.1,
  eTau: Math.log10(Recover.PATCH_DEFAULTS.tau), eTrust: Recover.PATCH_DEFAULTS.trust };
const C = Recover.CLIP_DEFAULTS;
const METHOD_PRESETS = {
  regions: PLANE_PRESET,
  extend: { ...PLANE_PRESET, eMerge: true },
  patches: { ...PLANE_PRESET, pChamfer: Recover.PATCH_DEFAULTS.chamfer, pStitch: Recover.PATCH_DEFAULTS.stitch },
  collapse: { ...PLANE_PRESET, pChamfer: Recover.PATCH_DEFAULTS.chamfer, pStitch: Recover.PATCH_DEFAULTS.stitch },
  merge: { sampled: true, tangent: true, mirrored: false, balls: true, ballRho: Recover.BALL_DEFAULTS.rho,
    ballCap: Math.log10(Recover.BALL_DEFAULTS.cap), mSnap: Recover.MERGE_DEFAULTS.snap > 0, mGaps: Recover.MERGE_DEFAULTS.gaps },
  clip: { cParallel: C.parallelDeg, cUnion: C.concaveUnion, cMutual: C.mutualConvex, cRing2All: C.ring2All, cFeatures: C.features,
    cSimilar: C.similarDeg, cTurn: C.turnFactor, cMargin: C.marginDeg, cOnPlane: C.onPlaneFactor, cRing2: C.ring2, cSplit: C.splitFeature },
};
$('recMethod').addEventListener('change', () => {
  if ($('recPreset').checked) for (const [id, v] of Object.entries(METHOD_PRESETS[$('recMethod').value] || {})) {
    const el = $(id); if (el.type === 'checkbox') el.checked = v; else el.value = v;
  }
  compute(); applyVisuals();
});
const reclip = () => { if (data.recovered?.clip) { data.recovered = clipPlanesNow(); buildRecovered(); updateStats(); } applyVisuals(); };
for (const id of ['cParallel', 'cSimilar', 'cTurn', 'cMargin', 'cOnPlane']) $(id).addEventListener('input', reclip);
for (const id of ['cFeatures', 'cRing2', 'cRing2All', 'cSplit', 'cUnion', 'cMutual']) $(id).addEventListener('change', reclip);
$('npts').addEventListener('input', applyVisuals);
$('npts').addEventListener('change', compute);
for (const id of ['sphOp', 'pcOp', 'surfOp', 'sliceZ']) $(id).addEventListener('input', applyVisuals);
for (const id of ['centers', 'pcEdges', 'slice', 'bbox']) $(id).addEventListener('change', applyVisuals);
$('pcColorBy').addEventListener('change', buildTransparent);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
compute();
renderer.setAnimationLoop(() => {
  controls.update();
  sortTransparent();
  renderer.render(scene, camera);
});
</script>
</body>
